name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test / ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.86 is the MSRV (driven by the idna/icu dependency tree).
        rust: [stable, "1.86"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        run: cargo test --all-features --verbose
      - name: Test (no default features — core no_alloc)
        run: cargo test --no-default-features --verbose
      - name: Test (alloc, no idna)
        run: cargo test --no-default-features --features alloc --verbose

  no-std:
    name: no_std build / thumbv6m-none-eabi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build core (no_std + no_alloc)
        run: cargo build -p psl2 --no-default-features --target thumbv6m-none-eabi
      - name: Build no_std + alloc + idna
        run: cargo build -p psl2 --no-default-features --features idna --target thumbv6m-none-eabi

  cross-arch:
    # Run the *actual test suite* under QEMU on a spread of architectures. The
    # embedded trie is little-endian on disk and decoded with explicit
    # from_le_bytes, so the big-endian targets (s390x, powerpc) are the real
    # proof that lookups are endianness-independent; the 32-bit targets exercise
    # the u32->usize offset casts on a narrower pointer width.
    name: cross test / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: s390x-unknown-linux-gnu        # 64-bit big-endian
          - target: powerpc-unknown-linux-gnu      # 32-bit big-endian
          - target: aarch64-unknown-linux-gnu      # 64-bit little-endian (ARM)
          - target: armv7-unknown-linux-gnueabihf  # 32-bit little-endian (ARM)
          - target: i686-unknown-linux-gnu         # 32-bit little-endian (x86)
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # --lib --tests runs unit + integration tests (incl. the official PSL
      # vectors) but skips benches/doctests, which are slow and pointless under
      # emulation.
      - name: Test (all features) under QEMU
        run: cross test --target ${{ matrix.target }} --all-features --lib --tests --verbose
      - name: Test (core no_alloc) under QEMU
        run: cross test --target ${{ matrix.target }} --no-default-features --lib --tests --verbose

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --all-features

  generated-up-to-date:
    name: generated data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate from the vendored list
        run: cargo run -p xtask
      - name: Fail if the embedded data would change
        run: |
          git diff --exit-code \
            src/trie_nodes.bin src/trie_edges.bin src/trie_labels.bin \
            src/rules.txt src/wildcards.txt src/exceptions.txt \
            src/psl_version.txt
