[package]
name = "psl2"
version = "0.1.2"
edition = "2021"
# MSRV is driven by the `idna` dependency tree (icu/idna_adapter require 1.86).
# The no_std/no_alloc core (default-features = false) works on much older Rust.
rust-version = "1.86"
description = "A modern alternative to the psl crate: Mozilla's Public Suffix List with built-in IDNA, fast builds, no_std support, and a clean API."
repository = "https://github.com/KarpelesLab/psl2"
homepage = "https://github.com/KarpelesLab/psl2"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["psl", "public-suffix", "domain", "tld", "cookie"]
categories = ["web-programming", "parser-implementations"]
# Allowlist: ship only the pre-generated data + sources. The raw .dat, the
# xtask generator, and CI config are intentionally excluded from the package
# so consumer builds stay tiny and fast.
# Ship only the flattened trie + version. The human-readable rules*.txt are
# generated into the repo for inspection/benchmarks but are not packaged.
include = [
    "src/**/*.rs",
    "src/trie_nodes.bin",
    "src/trie_edges.bin",
    "src/trie_labels.txt",
    "src/psl_version.txt",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[workspace]
members = ["xtask"]

[dependencies]
# Used only to normalize the *query* (Unicode -> ASCII/punycode). Optional and
# configured for no_std + alloc; consumers who pass ASCII can drop it entirely.
idna = { version = "1.1", optional = true, default-features = false, features = [
    "compiled_data",
] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "vs_native"
harness = false

[features]
default = ["std", "idna"]
# `std` currently only implies `alloc` (and links idna's std paths); the crate
# itself is always `#![no_std]`.
std = ["alloc", "idna?/std"]
# Enables the allocating convenience API (owned results, query normalization).
alloc = ["idna?/alloc"]
# Unicode/IDN input via the `idna` crate (implies `alloc`). Without it, input
# must be ASCII/punycode.
idna = ["dep:idna", "alloc"]

[package.metadata.docs.rs]
all-features = true
